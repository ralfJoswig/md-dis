<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1e24"/>
      <stop offset="100%" stop-color="#24292e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="8" y="8" width="240" height="240" rx="48" ry="48" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Document page -->
  <rect x="60" y="40" width="120" height="160" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="2"/>

  <!-- Folded corner -->
  <path d="M148 40 L180 40 L180 72 Z" fill="#21262d" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M148 40 L148 72 L180 72" fill="none" stroke="#30363d" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- "MD" text -->
  <text x="120" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff">MD</text>

  <!-- Small diagram: 3 boxes connected by lines -->
  <rect x="75" y="140" width="28" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>
  <rect x="147" y="140" width="28" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>
  <rect x="111" y="168" width="28" height="18" rx="3" fill="#58a6ff" opacity="0.9"/>

  <!-- Connection lines -->
  <line x1="89" y1="158" x2="111" y2="168" stroke="#58a6ff" stroke-width="2" opacity="0.7"/>
  <line x1="161" y1="158" x2="139" y2="168" stroke="#58a6ff" stroke-width="2" opacity="0.7"/>
  <line x1="103" y1="149" x2="147" y2="149" stroke="#58a6ff" stroke-width="2" opacity="0.7"/>
</svg>
